name: build-icons
on:
  workflow_dispatch:
  push:
    paths:
      - 'icons/icons/**'
      - '.github/workflows/icons.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode icons
        run: |
          base64 -d icons/icons/apple-touch-icon.b64 > apple-touch-icon.png
          base64 -d icons/icons/icon-192.b64 > icon-192.png
          base64 -d icons/icons/icon-512.b64 > icon-512.png
          file apple-touch-icon.png icon-192.png icon-512.png
      - name: Commit PNG files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          git commit -m "Add icon PNG files" || echo "nothing to commit"
          git push
